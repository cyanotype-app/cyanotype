# Whole stack: `docker compose up -d --build` then use http://localhost:3000.
# Datadog Agent is opt-in: `docker compose --profile datadog up -d` (needs DD_API_KEY in your env).

name: cyanotype

x-app-env: &app-env
  DATABASE_URL: postgres://cyanotype:cyanotype@postgres:5432/cyanotype
  LOG_FORMAT: json
  RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
  DD_ENV: ${DD_ENV:-local}
  DD_VERSION: ${DD_VERSION:-}

# Queue/upload metrics go to the Agent's DogStatsD (UDP 8125) when the `datadog` profile runs; without the Agent the
# name does not resolve and the services drop their metrics silently (one warning at start). docs/observability.md.
x-metrics-env: &metrics-env
  DOGSTATSD_URL: ${DOGSTATSD_URL-udp://datadog-agent:8125}

x-s3-env: &s3-env
  S3_ENDPOINT: http://seaweedfs:8333
  # Embedded in presigned URLs, so it must be reachable from the client (your host).
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: cyanotype
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cyanotype
      POSTGRES_PASSWORD: cyanotype
      POSTGRES_DB: cyanotype
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    labels:
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"cyanotype-postgres"}]'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyanotype"]
      interval: 5s
      retries: 10

  # S3 API for local dev (SeaweedFS, pinned like CI). Published on host :9000 (the port the MinIO setup used).
  # The access/secret key come from S3_ACCESS_KEY / S3_SECRET_KEY (same defaults as .env.example).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec weed server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=200 -master.volumeSizeLimitMB=64
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:8333"]
    volumes: [seaweeddata:/data]
    healthcheck:
      # SeaweedFS binds to the container IP, not localhost. The S3 port answers 403 to anonymous requests, so probe
      # the master and filer (the S3 gateway starts after them; the init step waits for S3 itself).
      test: ["CMD-SHELL", "ip=$$(hostname -i); wget -q -O /dev/null http://$$ip:9333/cluster/status && wget -q -O /dev/null http://$$ip:8888/"]
      interval: 5s
      retries: 20

  # One-shot: creates the bucket and turns versioning on (production's bucket is versioned; the purge code relies
  # on it). Idempotent. Reuses the SeaweedFS image (curl signs the requests with SigV4), so no extra image is pulled.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: cyanotype
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3() { curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" "$$@"; }
        until s3 -o /dev/null http://seaweedfs:8333/; do sleep 1; done
        s3 -o /dev/null -X PUT http://seaweedfs:8333/$$S3_BUCKET || true
        s3 -o /dev/null -X PUT "http://seaweedfs:8333/$$S3_BUCKET?versioning" \
          -d '<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
        s3 "http://seaweedfs:8333/$$S3_BUCKET?versioning" | grep -q Enabled
        echo "bucket $$S3_BUCKET ready (versioned)"
    restart: "no"

  # One-shot: the only place migrations run. Services wait for it to finish.
  migrate:
    build: { context: ., target: cli }
    image: cyanotype-cli
    command: ["migrate"]
    environment:
      <<: *app-env
      DD_SERVICE: cyanotype-migrate
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot disaster recovery, never started by `up` (profile `tools`): rebuild or repair the asset index from the
  # bucket. A dry run unless --apply is passed; extra arguments are appended to the subcommand:
  #   docker compose run --rm reindex                                  # report only
  #   docker compose run --rm reindex --apply --rethumb                # write
  # Read docs/recovery.md first (stop auth/assets/worker, restore the dump, dry run, review, apply).
  reindex:
    build: { context: ., target: cli }
    image: cyanotype-cli
    profiles: [tools]
    entrypoint: ["/usr/local/bin/app", "reindex"]
    command: []
    environment:
      <<: [*app-env, *s3-env]
      DD_SERVICE: cyanotype-reindex
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
    restart: "no"

  auth:
    build: { context: ., target: auth }
    image: cyanotype-auth
    environment:
      <<: *app-env
      DD_SERVICE: cyanotype-auth
      AUTH_BIND_ADDR: 0.0.0.0:3001
      # Local dev runs over plain http and re-registers a throwaway user on every `just e2e`,
      # so relax the service defaults (Secure cookie, invite). Production overrides both.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      AUTH_TOTP_KEY: ${AUTH_TOTP_KEY:-}
    labels:
      com.datadoghq.ad.logs: '[{"source":"rust","service":"cyanotype-auth"}]'
    depends_on:
      migrate: { condition: service_completed_successfully }

  assets:
    build: { context: ., target: assets }
    image: cyanotype-assets
    environment:
      <<: [*app-env, *s3-env, *metrics-env]
      DD_SERVICE: cyanotype-assets
      ASSETS_BIND_ADDR: 0.0.0.0:3002
      # Days a photo stays in the trash before it is deleted for good (docs/library.md).
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      # Cookie of a password-protected share link (same setting as the session cookie).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    labels:
      com.datadoghq.ad.logs: '[{"source":"rust","service":"cyanotype-assets"}]'
    depends_on:
      migrate: { condition: service_completed_successfully }
      seaweedfs-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    image: cyanotype-worker
    environment:
      <<: [*app-env, *s3-env, *metrics-env]
      DD_SERVICE: cyanotype-worker
    labels:
      com.datadoghq.ad.logs: '[{"source":"rust","service":"cyanotype-worker"}]'
    depends_on:
      migrate: { condition: service_completed_successfully }
      seaweedfs-init: { condition: service_completed_successfully }

  # Static web UI (Vite build served by Caddy). Reached through the gateway, not published.
  web:
    build: { context: apps/web, target: web }
    image: cyanotype-web
    labels:
      com.datadoghq.ad.logs: '[{"source":"caddy","service":"cyanotype-web"}]'

  # Gateway: the single origin clients talk to (/auth/* -> auth, /assets/* -> assets, everything else -> web).
  gateway:
    image: caddy:2-alpine
    ports: ["3000:3000"]
    volumes: ["./infra/caddy:/etc/caddy:ro"]
    labels:
      com.datadoghq.ad.logs: '[{"source":"caddy","service":"cyanotype-gateway"}]'
    depends_on: [auth, assets, web]

  # Nightly pg_dump -> S3 (backups/postgres/). Opt-in locally (`--profile backup`, or
  # `just backup-now`); always on in production (docker-compose.prod.yml). See docs/deploy.md.
  backup:
    build: { context: infra/backup }
    image: cyanotype-backup
    profiles: [backup]
    environment:
      <<: *s3-env
      DATABASE_URL: postgres://cyanotype:cyanotype@postgres:5432/cyanotype
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-03:17}
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }

  # Opt-in log collection. The apps log JSON to stdout; the Agent tails container logs.
  # Datadog ingestion has not been exercised in this repo's CI (no API key); see docs/observability.md.
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    profiles: [datadog]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      # DogStatsD: listen on all interfaces so the other containers can reach it as datadog-agent:8125. The port is
      # not published, so only containers on this compose network can send to it.
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      # Never ship other projects' logs from a shared host: exclude everything, then include only this
      # project's containers (compose names them cyanotype-<service>-<n>; the project name is pinned above).
      DD_CONTAINER_EXCLUDE_LOGS: "name:.*"
      DD_CONTAINER_INCLUDE_LOGS: "name:^cyanotype-.*"
      # Same scoping for container metrics (CPU, memory, restarts): this project's containers only.
      DD_CONTAINER_EXCLUDE_METRICS: "name:.*"
      DD_CONTAINER_INCLUDE_METRICS: "name:^cyanotype-.*"
      DD_HOSTNAME: ${DD_HOSTNAME:-cyanotype-compose}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  pgdata:
  seaweeddata:
