[package]
name = "cyanotype-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Text in photos: PP-OCR text detection and recognition (ONNX Runtime) and QR code reading, for the worker."

[dependencies]
anyhow.workspace = true
fast_image_resize = "6.1.0"
# The same ONNX Runtime build as the search models (cyanotype-clip): one runtime in the process.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
# QR decoder: a Rust port of ZXing, pure Rust. Pinned; see docs/build.md ("Text in photos") for why this and not `rqrr`. Only
# the QR reader and the multi-code helper are compiled in (no image crate, no encoders, no other formats).
rxing = { version = "=0.9.3", default-features = false, features = ["decoders", "qrcode", "multi_barcode_readers", "encoding_rs"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
