name: Deploy
# Deploys a published image version to the VPS over SSH. GitHub Environment `dev` (Settings -> Environments)
# holds the secrets and lets you require reviewers before this job runs. Roll back by running this workflow
# manually with an older version (see docs/deploy.md).
#
# Secrets (environment `dev`): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (dedicated ed25519 private key),
# DEPLOY_KNOWN_HOSTS (pinned host key line(s) for DEPLOY_HOST). Optional environment variable
# CYANOTYPE_HOSTNAME for the health check (default: DEPLOY_HOST).
#
# The images are private. The job's short-lived GITHUB_TOKEN (packages: read) is piped over SSH into
# `docker login --password-stdin` on the server for the duration of the deploy, then `docker logout`.
# It is never placed on a command line, so it is not in any process list, and GitHub masks it in logs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy: sha-<short>, X.Y.Z or latest. Empty = sha-<short> of the selected ref."
        required: false
        default: ""
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    # Auto-deploy only after a successful publish of main (not of tags or failed builds).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      HEALTH_HOST: ${{ vars.CYANOTYPE_HOSTNAME || secrets.DEPLOY_HOST }}
    steps:
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$GITHUB_SHA}"
          version="${INPUT_VERSION:-sha-${sha::7}}"
          if ! [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "::error::invalid version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $version"

      - name: Configure SSH (pinned host key, no TOFU)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CFG
          sed -i 's/^ *//' ~/.ssh/config

      - name: Registry login on the server (token over stdin)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # printf is a shell builtin and the remote command carries no secret: the token is only
          # ever on stdin. The user name is not secret.
          printf '%s' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Pull, migrate, up
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          ssh target bash -s -- "$VERSION" <<'REMOTE'
          set -euo pipefail
          version="$1"
          cd ~/cyanotype
          test -f .env.prod || { echo ".env.prod missing on the server" >&2; exit 1; }
          # Compose/Caddy files should match the images: sha-* -> that commit, X.Y.Z -> tag vX.Y.Z, else main.
          git fetch --quiet --tags origin
          case "$version" in
            sha-*)  git checkout --quiet --detach "${version#sha-}" ;;
            [0-9]*) git checkout --quiet --detach "v$version" ;;
            *)      git checkout --quiet main && git pull --ff-only --quiet ;;
          esac
          sed -i "s/^CYANOTYPE_VERSION=.*/CYANOTYPE_VERSION=$version/" .env.prod
          profiles=""
          if grep -q '^DD_API_KEY=.\+' .env.prod; then profiles="--profile datadog"; fi
          dc() { docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml $profiles "$@"; }
          dc pull --quiet
          dc run --rm migrate
          dc up -d --remove-orphans --wait --wait-timeout 180
          dc ps
          REMOTE

      - name: Registry logout on the server
        if: always()
        run: ssh target "docker logout ghcr.io" || true

      - name: Health check
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "https://$HEALTH_HOST/healthz"
          echo
