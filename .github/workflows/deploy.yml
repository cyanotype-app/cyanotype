name: Deploy
# Deploys a published image version to the VPS over SSH. GitHub Environment `dev` (Settings -> Environments)
# holds the secrets and lets you require reviewers before this job runs. Roll back by running this workflow
# manually with an older version (see docs/deploy.md).
#
# Auto-deploys (workflow_run) additionally wait for the CI run of the same commit and fail unless it succeeded;
# manual dispatch skips that gate.
#
# Secrets (environment `dev`): DEPLOY_HOST (the origin IP or a DNS-only name; SSH cannot pass through the Cloudflare proxy), DEPLOY_USER,
# DEPLOY_SSH_KEY (plain ed25519 private key; its public half is in the server's authorized_keys),
# DEPLOY_KNOWN_HOSTS (pinned host key line(s) for DEPLOY_HOST). Optional environment variable
# CYANOTYPE_HOSTNAME for the health check, as a variable or a secret (default: DEPLOY_HOST, which only works
# if that is a DNS name serving the site certificate, not a bare IP).
#
# The server never runs git (the repository is private and deploy keys are not used). The job builds a
# "deploy bundle" (compose files, infra/caddy, VERSION) for the version and streams it over the same SSH
# connection into ~/cyanotype, replacing only the managed files (never .env.prod or certs/).
#
# The images are private. The job's short-lived GITHUB_TOKEN (packages: read) is piped over SSH into
# `docker login --password-stdin` on the server for the duration of the deploy, then `docker logout`.
# It is never placed on a command line, so it is not in any process list, and GitHub masks it in logs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy: sha-<short>, X.Y.Z or latest. Empty = sha-<short> of the selected ref."
        required: false
        default: ""
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    # Auto-deploy only after a successful publish of main (not of tags or failed builds).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    environment: dev
    permissions:
      contents: read
      packages: read
      actions: read # the CI gate reads the CI run of the commit
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      HEALTH_HOST: ${{ vars.CYANOTYPE_HOSTNAME || secrets.CYANOTYPE_HOSTNAME || secrets.DEPLOY_HOST }}
    steps:
      # Full history and tags: scripts/deploy.sh maps the version to a commit (sha-<short> -> that commit,
      # X.Y.Z -> tag vX.Y.Z, latest -> origin/main) and builds the deploy bundle from it with `git archive`.
      # The scripts run from the ref this workflow was dispatched on, so rolling back to an old tag still
      # works even though the old tag predates them. The server never runs git and has no GitHub credential.
      - name: Check out (history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Auto-deploys only: do not ship a commit whose CI failed (branch protection is unavailable on this plan).
      # Manual runs (workflow_dispatch) skip the gate on purpose: an explicit operator override, e.g. a rollback.
      - name: Wait for CI on this commit (auto-deploy gate)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: scripts/wait-for-ci.sh "$RUN_SHA"

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$GITHUB_SHA}"
          version="${INPUT_VERSION:-sha-${sha::7}}"
          if ! [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "::error::invalid version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $version"

      - name: Configure SSH (pinned host key, no TOFU)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CFG
          sed -i 's/^ *//' ~/.ssh/config

      - name: Deploy (ship bundle, pull, migrate, up)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DEPLOY_SSH: target
          # Piped over stdin into `docker login --password-stdin` by scripts/deploy.sh, and followed by
          # `docker logout` when the script exits. Never on a command line.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: scripts/deploy.sh "$VERSION"

      - name: Registry logout on the server (safety net)
        if: always()
        run: ssh target "docker logout ghcr.io" || true

      - name: Health check
        run: |
          set -euo pipefail
          if [[ -z "$HEALTH_HOST" || "$HEALTH_HOST" =~ ^[0-9.]+$ || "$HEALTH_HOST" == *:* ]]; then
            echo "::error::health check needs the public hostname, not an IP: set CYANOTYPE_HOSTNAME (variable or secret)"; exit 1
          fi
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "https://$HEALTH_HOST/healthz"
          echo
