name: CI
on:
  push: { branches: [main] }
  pull_request:

# Least privilege by default; a job that needs more declares it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      images: ${{ steps.filter.outputs.images }}
      compose: ${{ steps.filter.outputs.compose }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - 'Dockerfile'
              - 'apps/**'
              - 'crates/**'
              - 'justfile'
              - 'scripts/**'
              - 'models/**'
              - '.github/workflows/ci.yml'
            images:
              - 'Dockerfile'
              - 'rust-toolchain.toml'
              - '.dockerignore'
              - 'docker-bake.hcl'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/**'
              - 'crates/**'
              - 'infra/backup/**'
              - 'models/**'
              - 'scripts/fetch-models.sh'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose*.yml'
              - '.env.prod.example'
              - 'infra/**'
              - 'apps/web/Caddyfile'
              - 'scripts/test-gateway-headers.sh'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, tests, migrate)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: cyanotype, POSTGRES_PASSWORD: cyanotype, POSTGRES_DB: cyanotype }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cyanotype" --health-interval 5s --health-retries 10
    env:
      # Set, so the job-queue integration tests run against the Postgres service.
      DATABASE_URL: postgres://cyanotype:cyanotype@localhost:5432/cyanotype
      # A SeaweedFS container (started below) backs the storage, upload-metadata and reindex integration tests.
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: cyanotype
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start SeaweedFS (S3 API with a versioned bucket, like production)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data -volume.max=200 -master.volumeSizeLimitMB=64
          until curl -fsS -o /dev/null http://localhost:8333/; do sleep 1; done
          curl -fsS -X PUT http://localhost:8333/cyanotype
          curl -fsS -X PUT "http://localhost:8333/cyanotype?versioning" \
            -d '<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
      # The worker builds libheif (vendored, pinned by the libheif-sys crate) from source with cmake,
      # and links the HEVC and AV1 decoder libraries from the system.
      - name: System libraries for the worker (libheif codecs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libde265-dev libdav1d-dev
      # Installs the version pinned in rust-toolchain.toml. rust-cache stays the cache (so the action's own is off),
      # and rustflags is emptied so the action does not add -D warnings on top of `just check`.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with: { cache: false, rustflags: "" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      # The search models (CLIP 150 MB, SigLIP 2 380 MB, pinned by sha256 in models/*.lock) for the tokenizer/preprocessing
      # parity and the search-quality tests: cached by the lock files' hash, and the tests fail (instead of skipping) without
      # them. Runners differ in CPU (the 8-bit kernels are a little different with and without AVX-512 VNNI); the model name
      # is printed so a parity failure can be read against it (crates/cyanotype-clip/tests/model.rs).
      - name: Search models for the search tests
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            models/clip
            models/siglip2
          key: search-models-${{ hashFiles('models/clip.lock', 'models/siglip2.lock') }}
      - run: scripts/fetch-models.sh
      - run: |
          echo "SEARCH_MODEL_DIR=$PWD/models" >> "$GITHUB_ENV"
          echo "CYANOTYPE_REQUIRE_MODEL=1" >> "$GITHUB_ENV"
          grep -m1 'model name' /proc/cpuinfo || true
      # The Docker build compiles tools/onnx_split.rs with plain rustc (no Cargo) to move the text tower's embedding table into
      # a side file, then splits the real model with it. The library tests check that the split model gives the same vectors.
      - name: onnx-split builds with plain rustc and splits the text tower
        run: |
          rustc --edition 2024 -O -o "$RUNNER_TEMP/onnx-split" tools/onnx_split.rs
          cp models/siglip2/text_model_int8.onnx "$RUNNER_TEMP/text.onnx"
          "$RUNNER_TEMP/onnx-split" "$RUNNER_TEMP/text.onnx"
          test "$(stat -c %s "$RUNNER_TEMP/text.onnx.data")" -gt 100000000
      - name: Dockerfile builds with the pinned Rust version
        run: scripts/check-rust-pin.sh
      - run: just check
      - name: deploy.sh against a fake ssh (regression test)
        run: scripts/test-deploy.sh
      - name: Migrations apply cleanly (the one-shot migrate step services depend on)
        run: just migrate

  web:
    name: Web (typecheck, lint, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      - run: just web-check
      - run: just web-build

  images:
    name: Images (buildx bake, no push)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      CACHE: gha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to `docker buildx bake` for type=gha.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      # One bake = one shared builder stage = the workspace compiles once for all the Rust images.
      - run: just images

  compose:
    name: Compose and gateway config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile datadog config -q
      - name: Production compose is valid with the placeholder env (also with the datadog profile)
        run: |
          prod="docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml"
          $prod config -q
          $prod --profile datadog config -q
      - name: Caddyfiles are valid
        run: |
          for f in Caddyfile Caddyfile.prod; do
            docker run --rm -e CYANOTYPE_HOSTNAME=photos-dev.cyanotype.app -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2-alpine \
              caddy validate --config "/etc/caddy/$f" --adapter caddyfile
          done
      - name: Share pages send no-referrer through the gateway
        run: scripts/test-gateway-headers.sh
      - name: Backup script (shellcheck)
        run: shellcheck infra/backup/backup.sh
