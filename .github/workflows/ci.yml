name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      images: ${{ steps.filter.outputs.images }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'apps/**'
              - 'crates/**'
              - 'justfile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            images:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-bake.hcl'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/**'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, tests, migrate)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: cyanotype, POSTGRES_PASSWORD: cyanotype, POSTGRES_DB: cyanotype }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cyanotype" --health-interval 5s --health-retries 10
    env:
      # Set, so the job-queue integration tests run against the Postgres service.
      DATABASE_URL: postgres://cyanotype:cyanotype@localhost:5432/cyanotype
      S3_BUCKET: cyanotype
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just check
      - name: Migrations apply cleanly (the one-shot migrate step services depend on)
        run: just migrate

  images:
    name: Images (buildx bake, no push)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to `docker buildx bake` for type=gha.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: extractions/setup-just@v2
      # One bake = one shared builder stage = the workspace compiles once for all four images.
      - run: just images

  compose:
    name: Compose and gateway config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile datadog config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
