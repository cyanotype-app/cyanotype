name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      images: ${{ steps.filter.outputs.images }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'apps/**'
              - 'crates/**'
              - 'justfile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            images:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-bake.hcl'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/**'
              - 'crates/**'
              - 'infra/backup/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose*.yml'
              - '.env.prod.example'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, tests, migrate)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: cyanotype, POSTGRES_PASSWORD: cyanotype, POSTGRES_DB: cyanotype }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cyanotype" --health-interval 5s --health-retries 10
    env:
      # Set, so the job-queue integration tests run against the Postgres service.
      DATABASE_URL: postgres://cyanotype:cyanotype@localhost:5432/cyanotype
      S3_BUCKET: cyanotype
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just check
      - name: Migrations apply cleanly (the one-shot migrate step services depend on)
        run: just migrate

  images:
    name: Images (buildx bake, no push)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to `docker buildx bake` for type=gha.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: extractions/setup-just@v2
      # One bake = one shared builder stage = the workspace compiles once for all four images.
      - run: just images

  compose:
    name: Compose and gateway config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile datadog config -q
      - name: Production compose is valid with the placeholder env (also with the datadog profile)
        run: |
          prod="docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml"
          $prod config -q
          $prod --profile datadog config -q
      - name: Caddyfiles are valid
        run: |
          for f in Caddyfile Caddyfile.prod; do
            docker run --rm -e CYANOTYPE_HOSTNAME=photos-dev.cyanotype.app -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2-alpine \
              caddy validate --config "/etc/caddy/$f" --adapter caddyfile
          done
      - name: Backup script (shellcheck)
        run: shellcheck infra/backup/backup.sh
