name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: cyanotype, POSTGRES_PASSWORD: cyanotype, POSTGRES_DB: cyanotype }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cyanotype" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cyanotype:cyanotype@localhost:5432/cyanotype
      S3_BUCKET: cyanotype
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # DATABASE_URL is set, so the job-queue integration tests run against the Postgres service.
      - run: cargo test --workspace
      - name: Migrations apply cleanly (the one-shot migrate step services depend on)
        run: cargo run -p cyanotype-cli -- migrate

  stack:
    name: Images and compose
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bin: [cyanotype-auth, cyanotype-assets, cyanotype-worker, cyanotype-cli]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BIN=${{ matrix.bin }} -t ${{ matrix.bin }} .
      - name: Compose file and gateway config are valid
        if: matrix.bin == 'cyanotype-cli'
        run: |
          docker compose --profile datadog config -q
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
