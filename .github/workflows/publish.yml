name: Publish images
# Builds the five images with one `docker buildx bake` (the workspace compiles once) and pushes them to
# GHCR. Runs only for pushes to main and for v* tags; pull requests never reach this workflow (CI's
# `images` job builds without pushing). Uses the built-in GITHUB_TOKEN, no stored secrets.
#
# Tags per image (ghcr.io/<owner>/cyanotype-<svc>):
#   every run   sha-<short>
#   main        latest
#   vX.Y.Z      X.Y.Z, plus X.Y (and X when X > 0) for non-prerelease versions
on:
  push:
    branches: [main]
    tags: ["v*"]

# Never cancel a publish half-way; queue the next one behind it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    # Belt and braces: the triggers above already exclude pull requests.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      CACHE: gha
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute registry prefix and tags
        id: meta
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tags="sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
            fi
            tags="$tags,$v"
            if [[ "$v" != *-* ]]; then
              major="${v%%.*}"; minor="${v#*.}"; minor="${minor%%.*}"
              tags="$tags,$major.$minor"
              if [ "$major" != 0 ]; then tags="$tags,$major"; fi
            fi
          elif [ "$GITHUB_REF_NAME" = main ]; then
            tags="$tags,latest"
          fi
          echo "registry=ghcr.io/$owner/" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing tags: $tags"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to `docker buildx bake` for type=gha.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REVISION: ${{ github.sha }}
        run: docker buildx bake -f docker-bake.hcl --push
