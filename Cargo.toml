[workspace]
resolver = "2"
members = [
    "crates/cyanotype-core",
    "crates/cyanotype-service",
    "crates/cyanotype-clip",
    "apps/auth",
    "apps/assets",
    "apps/worker",
    "apps/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/cyanotype-app/cyanotype"
rust-version = "1.89"

[workspace.dependencies]
cyanotype-core = { path = "crates/cyanotype-core" }
cyanotype-clip = { path = "crates/cyanotype-clip" }
cyanotype-service = { path = "crates/cyanotype-service" }

anyhow = "1"
argon2 = "0.5"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# The worker's tests decode and encode multi-megapixel images. Optimise just the pixel-pushing dependencies in the
# dev/test profiles (the workspace crates stay unoptimised); a 3000x2000 decode drops from seconds to milliseconds.
[profile.dev.package.jpeg-decoder]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
# The worker's own test fixtures (synthetic photos generated pixel by pixel) are the other slow part.
[profile.dev.package.cyanotype-worker]
opt-level = 2
