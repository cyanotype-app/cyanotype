# Production override for ONE Linode VPS (4 GB). Use together with the base file:
#
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (add --profile datadog to include the Datadog Agent)
#
# Differences from local: images come from GHCR and are never built on the server; no SeaweedFS (S3 is
# Linode Object Storage via env); Postgres is not published; the gateway serves CYANOTYPE_HOSTNAME with
# HTTPS on 80/443 only (Let's Encrypt, or a Cloudflare Origin CA cert: CADDY_TLS_MODE); restart policies, healthchecks and memory limits. DD_ENV defaults to
# dev (the dev-tier instance); set DD_ENV=prod in .env.prod for a production instance.
# Memory budget (limits, not reservations): postgres 768m + worker 1280m + assets 512m + auth 256m +
# gateway 128m + backup 128m + web 64m = 3,136m, +384m with the Datadog Agent = 3,520m, leaving headroom on a 4 GB box.
# (Semantic search added 256m to the worker, for the image tower, and 128m to assets; SigLIP 2's text tower is bigger than
# CLIP's and took assets from 384m to 512m. Measured resident sizes are in docs/build.md, "Semantic search model".)
# DogStatsD: the worker and assets service inherit DOGSTATSD_URL=udp://datadog-agent:8125 from the base file; it only
# reaches an Agent when the datadog profile runs (the Agent listens with DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true).
# Reset/override tags (!reset, !override) need Docker Compose >= 2.24.

x-prod-env: &prod-env
  DATABASE_URL: postgres://cyanotype:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/cyanotype
  DD_ENV: ${DD_ENV:-dev}
  DD_VERSION: ${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}

x-prod-s3: &prod-s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env.prod}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}}
  S3_REGION: ${S3_REGION:-us-ord-10}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env.prod}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.prod}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.prod}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

# Rust services expose /healthz; the slim images have no curl, so probe with bash's /dev/tcp.
x-http-probe: &probe
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    # Sized for a 768m container shared with a small app tier.
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "effective_cache_size=512MB", "-c", "max_connections=50", "-c", "work_mem=8MB"]

  # No local S3 in production: S3 is Linode Object Storage.
  seaweedfs:
    profiles: [local-only]
    ports: !reset []
  seaweedfs-init:
    profiles: [local-only]

  migrate:
    image: ghcr.io/cyanotype-app/cyanotype-cli:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    mem_limit: 256m
    environment: *prod-env

  # Disaster recovery one-shot (docs/recovery.md): `dc run --rm reindex [--apply ...]`, or the "Reindex" workflow.
  # Not part of the steady-state memory budget above.
  reindex:
    image: ghcr.io/cyanotype-app/cyanotype-cli:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    mem_limit: 512m
    environment:
      <<: [*prod-env, *prod-s3]
    depends_on: !override
      postgres: { condition: service_healthy }

  auth:
    image: ghcr.io/cyanotype-app/cyanotype-auth:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *prod-env
      COOKIE_SECURE: "true"
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      # Seals two-factor secrets at rest. Unset: two-factor authentication is switched off (docs/deploy.md).
      AUTH_TOTP_KEY: ${AUTH_TOTP_KEY:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3001 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
      <<: *probe

  assets:
    image: ghcr.io/cyanotype-app/cyanotype-assets:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    restart: unless-stopped
    # 256m before search, 384m with CLIP's text tower (70 MB resident): SigLIP 2's text tower (loaded on the first query) is
    # 335 MB resident with its embedding table in a side file (523 MB without), plus the service and a query's activations.
    mem_limit: 512m
    environment:
      <<: [*prod-env, *prod-s3]
      # The model searches use (siglip2-b16 or clip-b32). A change re-indexes the library in the background while the previous
      # model keeps answering until SEARCH_SWITCH_PERCENT of the photos are done (docs/library.md, "Changing the search model").
      SEARCH_MODEL: ${SEARCH_MODEL:-siglip2-b16}
      SEARCH_SWITCH_PERCENT: ${SEARCH_SWITCH_PERCENT:-95}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      COOKIE_SECURE: "true"
    depends_on: !override
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3002 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
      <<: *probe

  # No listener, so no healthcheck: the process exits on fatal errors and `restart` brings it back.
  worker:
    image: ghcr.io/cyanotype-app/cyanotype-worker:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    restart: unless-stopped
    # Decoding large originals dominates memory; WORKER_HEAVY_CONCURRENCY bounds parallel decodes. 1280m = the 640 MB
    # decode budget below + the image tower (about 150 MB resident while its session is loaded, outside the budget)
    # + the text model (about 80 MB resident while loaded, also outside the budget; each text job holds 224 MB of the
    # budget while it runs, and the two models never work at once) + runtime, libheif and allocator slack. It was 1024m before search.
    mem_limit: 1280m
    environment:
      <<: [*prod-env, *prod-s3]
      WORKER_HEAVY_CONCURRENCY: ${WORKER_HEAVY_CONCURRENCY:-2}
      # Decode memory budget shared by all jobs; must stay well under mem_limit above. Jobs that need more
      # are refused with a permanent error instead of being OOM-killed.
      WORKER_MEMORY_BUDGET_MB: ${WORKER_MEMORY_BUDGET_MB:-640}
      # Background embedding of photos for search: threads of its ONNX session (1 leaves the other core of a 2 vCPU host
      # to thumbnails and Postgres; 2 roughly doubles the backfill speed), WORKER_EMBED=0 turns it off.
      WORKER_EMBED_THREADS: ${WORKER_EMBED_THREADS:-1}
      # Reading text off photos (search, copy, QR codes): threads of its ONNX sessions (same trade-off), WORKER_OCR=0 turns it off.
      WORKER_OCR_THREADS: ${WORKER_OCR_THREADS:-1}
      # Must be the same as the assets service's.
      SEARCH_MODEL: ${SEARCH_MODEL:-siglip2-b16}
    depends_on: !override
      migrate: { condition: service_completed_successfully }

  web:
    image: ghcr.io/cyanotype-app/cyanotype-web:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      <<: *probe

  gateway:
    # Same image as local; the production Caddyfile terminates TLS for CYANOTYPE_HOSTNAME.
    restart: unless-stopped
    mem_limit: 128m
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      CYANOTYPE_HOSTNAME: ${CYANOTYPE_HOSTNAME:?set CYANOTYPE_HOSTNAME in .env.prod}
      # auto (Let's Encrypt) or cloudflare-origin (Cloudflare proxy + Origin CA cert in ./certs).
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-auto}
    volumes:
      # Origin CA certificate for cloudflare-origin mode (origin.pem, origin-key.pem); unused in auto mode.
      - ./certs:/etc/cyanotype-certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: !override
      auth: { condition: service_healthy }
      assets: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      <<: *probe

  backup:
    image: ghcr.io/cyanotype-app/cyanotype-backup:${CYANOTYPE_VERSION:?set CYANOTYPE_VERSION in .env.prod}
    build: !reset null
    pull_policy: missing
    profiles: !reset []
    restart: unless-stopped
    mem_limit: 128m
    environment:
      <<: *prod-s3
      DATABASE_URL: postgres://cyanotype:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/cyanotype
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-03:17}
    depends_on: !override
      postgres: { condition: service_healthy }

  datadog-agent:
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      DD_HOSTNAME: ${DD_HOSTNAME:-cyanotype-dev}

volumes:
  caddy_data:
  caddy_config:
