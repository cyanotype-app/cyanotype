# The model the worker's `pets` job runs to put a box on each dog and cat (docs/pets.md): D-FINE-N, the smallest D-FINE (a real-time DETR
# object detector, 4 M parameters, 42.8 AP on COCO; Apache 2.0, Yansong Peng et al., https://github.com/Peterande/D-FINE), trained on COCO
# only, as the ONNX export that Hugging Face's transformers.js team published in
# https://huggingface.co/onnx-community/dfine_n_coco-ONNX from https://huggingface.co/ustc-community/dfine_n_coco (the Hugging Face
# port, whose model card states Apache 2.0), pinned to one commit of the ONNX repository (2025-04-30). The licence text is the repository's
# LICENSE at one commit (956d170, 2026-08-19; it travels with the weights and is installed next to them: Apache 2.0 requires it). Neither Hugging Face
# repository has a licence file of its own. Both are older than 14 days.
# `cyanotype-pets` expects exactly these files (crates/cyanotype-pets/src/lib.rs). Changing a line here is a model change: bump `MODEL`
# (or `VERSION`) in crates/cyanotype-core/src/pets.rs in the same commit, so photos are scanned again.
