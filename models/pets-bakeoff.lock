# The other detectors of the bake-off (docs/pets.md), for the bake-off only: nothing installs them.
#   LOCK=models/pets-bakeoff.lock scripts/fetch-models.sh models/pets-bakeoff
# (the shipped D-FINE-N is in models/pets.lock and is the fourth). All Apache 2.0:
#   yolox-s.onnx        YOLOX-s (Megvii; 40.5 AP on COCO as the Zoo measures it), the OpenCV Zoo's export, at the opencv_zoo commit that models/faces.lock pins too
#                       (2026-05-22); the Zoo's directory states Apache 2.0.
#   nanodet-plus.onnx   NanoDet-Plus-m-1.5x at 416 px (RangiLyu; 30.4 AP as the Zoo measures it), the same Zoo, the same commit.
#   rtdetr-r18vd.onnx   RT-DETR R18vd (Baidu), the ONNX export of https://huggingface.co/PekingU/rtdetr_r18vd (model card:
#                       Apache 2.0) that transformers.js published in https://huggingface.co/onnx-community/rtdetr_r18vd, pinned to one commit.
# The OpenCV Zoo also publishes block-quantised 8-bit variants of the first two; ONNX Runtime does not load or run them (a Resize without
# sizes or scales, a DequantizeLinear with a block size), so they are not candidates.
