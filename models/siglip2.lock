# The SigLIP 2 model the worker (image tower) and the assets service (text tower) run by default (SEARCH_MODEL=siglip2-b16):
# Google SigLIP 2 base, patch 16 at 224 px (Apache 2.0, https://huggingface.co/google/siglip2-base-patch16-224), as the ONNX
# export published by Hugging Face's transformers.js team in https://huggingface.co/onnx-community/siglip2-base-patch16-224-ONNX,
# pinned to one commit (2025-02-21). `cyanotype-clip` expects exactly these files (crates/cyanotype-clip/src/lib.rs,
# Model::Siglip2B16). Changing a line here is a model change: bump Model::version() in the same commit so photos are re-embedded.
#
# The image tower is the export's 4-bit weight-only quantisation (MatMulNBits), the text tower its 8-bit one: the export's
# 8-bit image tower loses too much (docs/build.md, "Which model, and why").
