# The face models the worker's `faces` job runs when FACES_ENABLED is on (docs/faces.md), from the OpenCV Zoo:
#   yunet.onnx  YuNet face detector with five landmarks per face (MIT, Shiqi Yu), the zoo's 2026-05 export with dynamic input
#               size, pinned to the opencv_zoo commit that added it (2026-05-22). Its LFS pointer's oid is the sha256 below.
#   sface.onnx  SFace face recognition, a MobileFaceNet trained with the sigmoid-constrained hypersphere loss (Apache 2.0,
#               Yaoyao Zhong), 128-dimension embeddings, as published at https://huggingface.co/opencv/face_recognition_sface
#               pinned to one commit (2025-06-20).
# The two licence texts travel with the weights (both licences require it) and are installed next to them.
# `cyanotype-faces` expects exactly these files (crates/cyanotype-faces/src/lib.rs). Changing a line here is a model change:
# bump VERSION (or MODEL) in crates/cyanotype-core/src/faces.rs in the same commit, so photos are scanned again.
