# The text-in-photos model (docs/build.md, "Text in photos"): PaddlePaddle's PP-OCRv6 small, text detection and text recognition,
# as the ONNX exports PaddlePaddle itself publishes on Hugging Face (Apache-2.0 licence), pinned to one commit each. The worker
# reads them from <models dir>/ocr/ (det.onnx, rec.onnx and rec.yml, whose `character_dict` is the recognition dictionary).
# det.yml is not read by the code (its postprocessing numbers are copied into apps/worker/src/ocr.rs); it is pinned so a change
# of those numbers upstream is visible here.
# Changing a line here is a model change: bump VERSION (or MODEL) in crates/cyanotype-core/src/ocr.rs in the same commit, so
# photos are read again (at low priority; the old text keeps answering searches until its photo's new text replaces it).
