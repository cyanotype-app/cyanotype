[package]
name = "cyanotype-cli"
description = "The `cyanotype` command line: migrations, login, bulk photo import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cyanotype"
path = "src/main.rs"

# `server-tools` (on by default) adds the operator commands that talk to Postgres and the bucket directly
# (migrate, reindex, manifest). The downloadable CLI is built with --no-default-features (Dockerfile, stage
# cli-dist): it pulls in neither sqlx nor the AWS SDK, so it cross-compiles cleanly and stays small.
[features]
default = ["server-tools"]
server-tools = ["dep:cyanotype-core", "dep:sqlx"]

[dependencies]
cyanotype-core = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

flate2 = "1"
futures-util = "0.3"
globset = "0.4"
indicatif = "0.17"
# Already in the lock file through rustls (Ed25519 verification of release signatures); no new crate.
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rpassword = "7"
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
axum.workspace = true
tempfile = "3"
